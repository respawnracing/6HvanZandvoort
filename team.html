<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Inschrijven Team - 6H Race</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; }
        button { background-color: #28a745; color: white; padding: 15px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Team Inschrijfformulier</h1>
    <form>
        <label>Teamnaam</label>
        <input type="text" required>
        
        <label>Racenummer</label>
        <input type="number" required>
        
        <label>Contactpersoon (Naam)</label>
        <input type="text" required>
        
        <label>E-mailadres</label>
        <input type="email" required>

        <button type="submit">AANVRAAG VERSTUREN</button>
    </form>

</body>
</html>
