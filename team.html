<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Inschrijven Team - Respawn: 6H van Zandvoort</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 15px; border: none; width: 100%; cursor: pointer; margin-top: 20px; }
        h3 { margin-top: 25px; border-bottom: 1px solid #ccc; }
    </style>
</head>
<body>

    <h1>Team Inschrijfformulier</h1>
    <form id="inschrijfForm">
        <label>Teamnaam</label>
        <input type="text" name="teamnaam" required>
        
        <label>Racenummer</label>
        <input type="number" name="racenummer" required>

        <label>Auto</label>
        <select name="auto" required>
            <option value="">-- Kies je auto --</option>
            <option value="Auto 1">Auto 1</option>
            <option value="Auto 2">Auto 2</option>
            <option value="Auto 3">Auto 3</option>
            <option value="Auto 4">Auto 4</option>
            <option value="Auto 5">Auto 5</option>
            <option value="Auto 6">Auto 6</option>
        </select>
        
        <label>Contactpersoon (Naam)</label>
        <input type="text" name="contactpersoon" required>

        <label>Team Logo (PNG of JPG)</label>
        <input type="file" id="logoFile" accept="image/png, image/jpeg">

        <label>Livery Bestand (.zip of .dds - Optioneel)</label>
        <input type="file" id="liveryFile" accept=".zip,.dds">

        <h3>Coureur 1 (Verplicht)</h3>
        <input type="text" name="coureur1_naam" placeholder="Voornaam Achternaam" required>
        <input type="text" name="coureur1_steam" placeholder="Steam ID">
        <input type="text" name="coureur1_discord" placeholder="Discordnaam">

        <h3>Coureur 2 (Verplicht)</h3>
        <input type="text" name="coureur2_naam" placeholder="Voornaam Achternaam" required>
        <input type="text" name="coureur2_steam" placeholder="Steam ID">
        <input type="text" name="coureur2_discord" placeholder="Discordnaam">

        <h3>Coureur 3 (Optioneel)</h3>
        <input type="text" name="coureur3_naam" placeholder="Voornaam Achternaam">
        <input type="text" name="coureur3_steam" placeholder="Steam ID">
        <input type="text" name="coureur3_discord" placeholder="Discordnaam">

        <button type="submit" id="submitBtn">AANVRAAG VERSTUREN</button>
    </form>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx6otdK_BuxRnvcT4oJAjwdrtqfrrlsdDW3TBh1L7zSod9eg2jmP6iGSy-tFTvMOj4r/exec';

        document.getElementById('inschrijfForm').addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Versturen... (even geduld)';
            btn.disabled = true;

            const form = e.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Helper functie om bestanden om te zetten naar Base64
            const fileToDataUri = (file) => new Promise((resolve) => {
                if (!file) { resolve({ data: "", name: "" }); return; }
                const reader = new FileReader();
                reader.onload = (e) => resolve({ data: e.target.result.split(',')[1], name: file.name });
                reader.readAsDataURL(file);
            });

            // Lees zowel logo als livery uit
            Promise.all([
                fileToDataUri(document.getElementById('logoFile').files[0]),
                fileToDataUri(document.getElementById('liveryFile').files[0])
            ]).then(([logo, livery]) => {
                data.logoData = logo.data;
                data.logoName = logo.name;
                data.liveryData = livery.data;
                data.liveryName = livery.name;

                // Verstuur naar Apps Script
                fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
                    .then(response => response.json())
                    .then(res => {
                        if(res.result === "success") {
                            document.body.innerHTML = `
                                <div style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif;">
                                    <h1>Bedankt voor je aanmelding voor Respawn: 6 uur van Zandvoort voor 3FM Serious Request</h1>
                                    <p>Je aanmelding is ontvangen onder code:<br><strong>${res.betaalcode}</strong></p>
                                    <p>Wij moedigen jullie aan een bijdrage te doen op deze pagina om de actie te steunen:</p>
                                    <p><a href="https://www.kominactie.nl" target="_blank" style="font-size: 18px; color: #28a745;">Klik hier om te doneren</a></p>
                                    <p>Vergeet niet de Discord van Respawn Racing te joinen:<br><a href="https://discord.gg/fsGMUMXa4q" target="_blank">Discord Link</a></p>
                                    <hr style="max-width: 400px; margin: 20px auto;">
                                    <p>De kwalificatie is op 19 december.</p>
                                    <p>De race start op zondag 20 december 2026 om 14:00.</p>
                                </div>
                            `;
                        } else {
                            alert('Fout: ' + res.message);
                            location.reload();
                        }
                    })
                    .catch(error => {
                        alert('Er ging iets mis bij het versturen.');
                        location.reload();
                    });
            });
        });
    </script>
</body>
</html>
