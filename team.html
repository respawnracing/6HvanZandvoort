<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Inschrijven Team - Respawn: 6H van Zandvoort voor 3FM Serious Request</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { background-color: #28a745; color: white; padding: 15px; border: none; width: 100%; cursor: pointer; margin-top: 20px; }
        h3 { margin-top: 25px; border-bottom: 1px solid #ccc; }
    </style>
</head>
<body>

    <h1>Team Inschrijfformulier</h1>
    <form id="inschrijfForm">
        <label>Teamnaam</label>
        <input type="text" name="teamnaam" required>
        
        <label>Racenummer</label>
        <input type="number" name="racenummer" required>

        <label>Auto</label>
        <select name="auto" required>
        <option value="Auto 1">Auto 1</option>
        <option value="Auto 2">Auto 2</option>
        <option value="Auto 3">Auto 3</option>
     <option value="Auto 4">Auto 4</option>
    <option value="Auto 5">Auto 5</option>
    <option value="Auto 6">Auto 6</option>
</select>

<label>Livery URL (Optioneel, mag ook later)</label>
<input type="text" name="livery_url" placeholder="Link naar je .zip of .dds bestand">
        
        <label>Contactpersoon (Naam)</label>
        <input type="text" name="contactpersoon" required>
        
        <label>E-mailadres</label>
        <input type="email" name="email" required>

        <h3>Coureur 1 (Verplicht)</h3>
        <input type="text" name="coureur1_naam" placeholder="Voornaam Achternaam" required>
        <input type="text" name="coureur1_steam" placeholder="Steam ID">
        <input type="text" name="coureur1_discord" placeholder="Discordnaam">

        <h3>Coureur 2 (Verplicht)</h3>
        <input type="text" name="coureur2_naam" placeholder="Voornaam Achternaam" required>
        <input type="text" name="coureur2_steam" placeholder="Steam ID">
        <input type="text" name="coureur2_discord" placeholder="Discordnaam">

        <h3>Coureur 3 (Optioneel)</h3>
        <input type="text" name="coureur3_naam" placeholder="Voornaam Achternaam">
        <input type="text" name="coureur3_steam" placeholder="Steam ID">
        <input type="text" name="coureur3_discord" placeholder="Discordnaam">

        <button type="submit" id="submitBtn">AANVRAAG VERSTUREN</button>
    </form>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz7MYKhuCysEKT666tz0OebpTXp2immMKvFavuH_2B0g0JKFZt2NafWDk7qIKoW5122PA/exec'; // <-- Vergeet niet je URL hier weer in te vullen!
        const form = document.getElementById('inschrijfForm');

        form.addEventListener('submit', e => {
            e.preventDefault();
            document.getElementById('submitBtn').innerText = 'Versturen...';
            
            fetch(scriptURL, { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(form))) })
                // Vervang je .then() blok in team.html door dit:
.then(response => response.json())
.then(data => {
    document.body.innerHTML = `
        <div style="text-align: center; margin-top: 50px;">
            <h1>Bedankt voor je aanmelding!</h1>
            <p>Je aanmelding is ontvangen onder code: <strong>${data.betaalcode}</strong></p>
            <p>Wij moedigen jullie aan een bijdrage te doen op deze pagina om de actie te steunen:</p>
            <a href="URL_NAAR_KOM_IN_ACTIE" target="_blank">Klik hier om te doneren</a>
            <p>Vergeet niet de <a href="DISCORD_LINK" target="https://discord.gg/fsGMUMXa4q">Discord van Respawn Racing</a> te joinen.</p>
            <hr>
            <p>De kwalificatie is op 19 december.</p>
            <p>De race start op zondag 20 december 2026 om 14:00.</p>
        </div>
    `;
})
                .catch(error => alert('Er ging iets mis.'));
        });
    </script>
</body>
</html>
